name: Build DULZ SMART PANEL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Android SDK
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 5. Ekstrak ZIP
      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "DULZ_SMART_PANEL_source.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::File source ZIP tidak ditemukan"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/dulz-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dulz-source"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/dulz-source" \
            -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle tidak ditemukan"
            exit 1
          fi

          PROJECT="${SETTINGS_FILE%/settings.gradle}"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Project ditemukan: $PROJECT"

      # 6. Periksa konfigurasi project
      - name: Check Project Files
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "File project ditemukan"

      # 7. Paksa kompatibilitas Java 17 dan Kotlin 17
      - name: Fix JVM Compatibility
        run: |
          cat > "$RUNNER_TEMP/force-java17.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }

                  tasks.matching {
                      it.class.name.contains("KotlinCompile")
                  }.configureEach {
                      if (hasProperty("kotlinOptions")) {
                          kotlinOptions.jvmTarget = "17"
                      }
                  }
              }
          }
          EOF

      # 8. Build APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            -I "$RUNNER_TEMP/force-java17.gradle" \
            clean assembleDebug

      # 9. Periksa APK
      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK gagal dibuat"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/DULZ-SMART-PANEL.apk"

          echo "APK berhasil ditemukan"

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DULZ-SMART-PANEL-APK
          path: output/DULZ-SMART-PANEL.apk
          if-no-files-found: error
          retention-days: 7
          
