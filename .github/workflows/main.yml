
name: Build DULZ SMART PANEL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "DULZ_SMART_PANEL_source.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP tidak ditemukan!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/dulz-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dulz-source"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/dulz-source" \
            -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=${SETTINGS_FILE%/settings.gradle}" \
            >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/DULZ-SMART-PANEL.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DULZ-SMART-PANEL-APK
          path: output/DULZ-SMART-PANEL.apk
          if-no-files-found: error
          
